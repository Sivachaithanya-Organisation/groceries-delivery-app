      # Logging into the AWS CLOUD
      - name: Configure AWS Credentials 2
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: us-west-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: without built in actions
        run: |
          aws ecr get-login-password --region us-west-2 | docker login --username AWS --password-stdin 794934876309.dkr.ecr.us-west-2.amazonaws.com
          docker build -t siva-docker .
          docker tag siva-docker:latest 794934876309.dkr.ecr.us-west-2.amazonaws.com/siva-docker:${{ github.sha }}
          docker push 794934876309.dkr.ecr.us-west-2.amazonaws.com/siva-docker:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: buildwithoutplugins
    steps:
      # Logging into the AWS CLOUD
      - name: Configure AWS Credentials 2
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: us-west-2
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          port: 22
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            whoami
            aws ecr get-login-password --region us-west-2 | docker login --username AWS --password-stdin 794934876309.dkr.ecr.us-west-2.amazonaws.com
            docker pull 794934876309.dkr.ecr.us-west-2.amazonaws.com/siva-docker:${{ github.sha }}
            docker rm -f grocery-app
            docker run -itd -p 3000:3000 --name grocery-app 794934876309.dkr.ecr.us-west-2.amazonaws.com/siva-docker:${{ github.sha }}
